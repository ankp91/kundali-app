<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0a0f1e"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#d4a017" stroke-width="3" opacity="0.6"/>

  <!-- Star of David / yantra inspired shape -->
  <g opacity="0.25">
    <polygon points="256,80 302,170 400,170 322,228 350,320 256,265 162,320 190,228 112,170 210,170" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  </g>

  <!-- Outer dots (nakshatra) -->
  <g fill="#d4a017" opacity="0.5">
    <circle cx="256" cy="50" r="3"/>
    <circle cx="353" cy="79" r="3"/>
    <circle cx="420" cy="163" r="3"/>
    <circle cx="440" cy="270" r="3"/>
    <circle cx="400" cy="370" r="3"/>
    <circle cx="320" cy="438" r="3"/>
    <circle cx="220" cy="450" r="3"/>
    <circle cx="130" cy="415" r="3"/>
    <circle cx="68" cy="345" r="3"/>
    <circle cx="45" cy="255" r="3"/>
    <circle cx="75" cy="163" r="3"/>
    <circle cx="155" cy="85" r="3"/>
  </g>

  <!-- Letter A — stylised -->
  <text x="256" y="320"
    font-family="Georgia, serif"
    font-size="240"
    font-weight="bold"
    fill="#d4a017"
    text-anchor="middle"
    dominant-baseline="auto"
    opacity="0.95">आ</text>

  <!-- Small "Aadya" wordmark -->
  <text x="256" y="440"
    font-family="Georgia, serif"
    font-size="36"
    fill="#d4a017"
    text-anchor="middle"
    letter-spacing="6"
    opacity="0.7">AADYA</text>
</svg>
